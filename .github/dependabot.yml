version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      vite-ecosystem:
        patterns:
          - "vite"
          - "@vitejs/*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
